[package]
name = "mwt"
version = "0.3.0"
edition = "2024"
description = "Manage polyrepo Git worktrees from a single .mwt.yaml"
license = "MIT"
repository = "https://github.com/Slothtron/mwt"

[lib]
name = "mwt"
path = "src/lib.rs"

[[bin]]
name = "mwt"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1"
serde_json = "1"
anyhow = "1"
thiserror = "1"
regex = { version = "1", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
